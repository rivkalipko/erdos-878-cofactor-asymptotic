version: "v0.4"
project:
  name: An asymptotic formula for the equality count in Erdős Problem 878(iv)
  description: >-
    The equality count for the functions f and F of Erdős Problem 878 is
    asymptotic to an explicit sum of logarithmic integrals indexed by the
    cofactor of the largest prime. Finite polynomial tests determine the sets
    of integration. The argument controls the discarded integers and sums a
    quantitative prime number theorem over the resulting intervals.
  authors: [Rivka Lipkovitz]
  responsible_maintainers: [Rivka Lipkovitz]
  license: Apache-2.0
classification:
  arxiv: [math.NT]
  msc2020: ["11N37", "11N25"]
sources:
  - title: Derivation of the cofactor integral formula for Erdős Problem 878(iv)
    type: original-proof
    relationship: other
    note: The formula and argument were developed in a private AI-assisted session led by the submitter. Priority relative to unpublished work is unknown.
  - title: On two unconventional number theoretic functions and on some related problems
    authors: [Paul Erdős]
    type: article
    location: https://www.erdosproblems.com/878
    relationship: background
  - title: Erdős Problem 878
    type: website
